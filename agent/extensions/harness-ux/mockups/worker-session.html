<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>pi · worker session — fullscreen overlay mockup</title>
<style>
  /* ── rose-pine exact ─────────────────────────────────────── */
  :root{
    --base:#191724; --surface:#1f1d2e; --overlay:#26233a;
    --muted:#6e6a86; --subtle:#908caa; --text:#e0def4;
    --love:#eb6f92; --gold:#f6c177; --rose:#ebbcba; --pine:#31748f;
    --foam:#9ccfd8; --iris:#c4a7e7;
    --hl0:#21202e; --hl1:#403d52; --hl2:#524f67;
    --frame:rgba(156,207,216,.4); /* 1px foam @ ~40% — the ONE outer frame */
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    background:#12101a;
    color:var(--text);
    font-family:ui-monospace,"SF Mono","Cascadia Code",Menlo,Consolas,"Liberation Mono",monospace;
    font-size:13px; line-height:1.45;
    display:flex; justify-content:center;
    padding:26px 16px 60px;
  }
  .stage{ width:1280px; }
  .caption{ color:var(--muted); font-size:12px; margin-bottom:10px; }

  /* ── state switcher ──────────────────────────────────────── */
  .controls{ display:flex; gap:8px; margin-bottom:14px; }
  .controls button{
    font:inherit; font-size:12px;
    color:var(--muted);
    background:transparent;
    border:1px solid var(--hl1); border-radius:4px;
    padding:3px 11px; cursor:pointer;
  }
  .controls button:hover{ color:var(--text); border-color:var(--hl2); background:var(--overlay); }
  .controls button.active{ background:var(--iris); border-color:var(--iris); color:#191724; font-weight:700; }

  /* ── fake herdr macOS window ─────────────────────────────── */
  .window{
    width:1280px; height:800px;
    background:var(--base);
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 24px 90px rgba(0,0,0,.55);
    display:flex; flex-direction:column;
  }
  .tabbar{
    flex:none; height:34px;
    display:flex; align-items:center; gap:6px;
    padding:0 10px;
    background:var(--overlay);
    user-select:none;
  }
  .lights{ display:flex; gap:7px; margin-right:10px; }
  .lights .l{ width:11px; height:11px; border-radius:50%; }
  .lights .r{ background:#ff5f57; }
  .lights .y{ background:#febc2e; }
  .lights .g{ background:#28c840; }
  .tab{ padding:2px 12px; border-radius:6px; font-size:12px; font-weight:600; }
  .tab.active{ background:var(--iris); color:#191724; font-weight:700; }
  .tabplus{ color:var(--muted); font-size:15px; padding:0 5px; }
  .tabplus:hover{ color:var(--text); }

  .chrome{ flex:1; display:flex; min-height:0; }
  .rail{ flex:none; height:100%; user-select:none; }

  /* far-left workspace rail — OUTSIDE our overlay */
  .rail-ws{
    width:28px; background:#12101c;
    border-right:1px solid var(--hl0);
    display:flex; flex-direction:column; align-items:center;
    padding-top:10px; gap:12px;
  }
  .ws-num{ font-size:13px; font-weight:700; }
  .ws-num.n1{ color:var(--foam); }
  .ws-num.n2{ color:var(--gold); }

  /* mid-left pane rail — reserved strip; overlay starts AFTER this */
  .rail-pane{
    width:36px; background:#16141f;
    display:flex; flex-direction:column; align-items:center;
    padding-top:10px; gap:14px;
  }
  .pane-item{ display:flex; flex-direction:column; align-items:center; gap:4px; }
  .dot{ width:7px; height:7px; border-radius:50%; }
  .d-foam{ background:var(--foam); }
  .d-gold{ background:var(--gold); }
  .d-check{ color:var(--foam); font-size:11px; font-weight:700; line-height:1; }

  /* ── our overlay: opaque base, single foam frame ─────────── */
  .overlay{
    flex:1; min-width:0;
    background:var(--base);          /* opaque — starts AFTER the herdr rails, collision gone */
    border:1px solid var(--frame);   /* the ONLY outer frame */
    display:flex; flex-direction:column;
  }
  .header{
    flex:none;
    display:flex; justify-content:space-between; align-items:baseline;
    padding:8px 12px;
    border-bottom:1px solid var(--hl0);
    white-space:nowrap;
  }
  .ok{ color:var(--foam); }
  .ok.gold{ color:var(--gold); }
  .ok.love{ color:var(--love); }
  .sep, .model{ color:var(--muted); }
  .rt.foam{ color:var(--foam); }
  .rt.gold{ color:var(--gold); }
  .rt.love{ color:var(--love); }

  .body{ flex:1; min-height:0; overflow-y:auto; padding:10px 12px; }

  .step{ margin-bottom:1.45em; }          /* one blank line between steps */
  .step.meta-row{ margin-bottom:0; }
  .row{ display:flex; }
  .gutter{
    flex:none; width:3ch; text-align:right; padding-right:1ch;
    color:var(--muted); user-select:none;
  }
  .gutter.cur{ color:var(--iris); font-weight:700; }
  .gutter.err{ color:var(--love); font-weight:700; }
  .content{ flex:1; min-width:0; }

  /* cards: surface, radius 4, no borders */
  .card{ background:var(--surface); border-radius:4px; padding:8px 10px; }
  .quote{ position:relative; }
  .qbar{
    position:absolute; left:0; top:4px; bottom:4px; width:3px;
    background:var(--foam); border-radius:2px;
  }
  .qbody{ margin-left:8px; }
  .qtext code{
    color:var(--subtle); background:var(--hl0);
    border-radius:3px; padding:0 3px;
  }
  pre.json{
    white-space:pre;
    background:var(--hl0); border-radius:3px;
    padding:6px 8px; margin:6px 0;
  }
  /* JSON tint */
  .k{ color:var(--subtle); }  /* keys    */
  .s{ color:var(--gold);   }  /* strings */
  .n{ color:var(--gold);   }  /* numbers */
  .b{ color:var(--iris);   }  /* bools   */
  .m{ color:var(--muted);  }  /* punctuation */

  .thought{ color:var(--gold); }
  .tog{ cursor:pointer; }
  .tog:hover .thought{ text-decoration:underline; }
  .t-time{ color:var(--muted); }
  .tbody{ color:var(--muted); }

  .ctitle{ color:var(--muted); margin-bottom:4px; }
  .cline{ display:flex; }
  .ln{ flex:none; width:2ch; text-align:right; margin-right:1ch; color:var(--muted); user-select:none; }
  .ctext{ flex:1; white-space:pre; }
  .writing{ color:var(--muted); font-style:italic; }

  .errline{ color:var(--love); font-weight:700; }
  .stderr{ color:var(--muted); }
  .meta{ color:var(--muted); }

  .empty{ height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:9px; text-align:center; }
  .e1{ color:var(--muted); }
  .e2{ color:var(--muted); opacity:.45; }

  .footer{
    flex:none;
    display:flex; justify-content:space-between; align-items:center;
    padding:8px 12px;
    border-top:1px solid var(--hl0);
    white-space:nowrap;
  }
  .f-meta{ color:var(--muted); }
  .f-meta.dim{ opacity:.45; }
  .keys{ display:flex; gap:6px; }
  .key{
    display:inline-flex; align-items:center;
    background:var(--hl0); border-radius:3px;
    padding:1px 7px; font-size:12px; color:var(--text);
  }
  .key.muted{ color:var(--muted); cursor:pointer; }
  .key.muted:hover{ color:var(--text); background:var(--hl1); }
  .key.dim{ color:var(--muted); opacity:.35; }
</style>
</head>
<body>
<div class="stage">
  <div class="caption">pi · harness UX — worker session (fullscreen overlay)</div>

  <div class="controls">
    <button data-state="done" class="active">Done</button>
    <button data-state="thought">Thought</button>
    <button data-state="running">Running</button>
    <button data-state="multi">Multi</button>
    <button data-state="empty">Empty</button>
    <button data-state="failed">Failed</button>
  </div>

  <div class="window">
    <div class="tabbar">
      <div class="lights"><span class="l r"></span><span class="l y"></span><span class="l g"></span></div>
      <div class="tab active">1 Z</div>
      <div class="tabplus">+</div>
    </div>
    <div class="chrome">
      <!-- far-left herdr workspace rail (28px) — OUTSIDE our overlay -->
      <div class="rail rail-ws">
        <div class="ws-num n1">1</div>
        <div class="ws-num n2">2</div>
      </div>
      <!-- mid-left herdr pane rail (36px) — reserved strip. Our overlay starts AFTER this,
           so rail numbers never sit on top of transcript text. Collision gone. -->
      <div class="rail rail-pane">
        <div class="pane-item"><span class="dot d-foam"></span></div>
        <div class="pane-item"><span class="dot d-gold"></span><span class="dot d-gold"></span></div>
        <div class="pane-item"><span class="d-check">✓</span></div>
      </div>
      <div class="overlay">
        <div class="header">
          <span id="hLeft"></span>
          <span id="hRight"></span>
        </div>
        <div class="body" id="body"></div>
        <div class="footer">
          <span id="fLeft"></span>
          <span class="keys" id="fRight"></span>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";
  var state = { mode:'done', thought:false, mi:2 };

  /* ── shared content ──────────────────────────────────────── */
  var jsonLines = [
    '<m>{</m>',
    '  <k>"name"</k><m>: </m><s>"worker-e2e-test"</s><m>,</m>',
    '  <k>"purpose"</k><m>: </m><s>"verify worker end-to-end"</s><m>,</m>',
    '  <k>"items"</k><m>: [</m><n>1</n><m>, </m><n>2</n><m>, </m><n>3</n><m>],</m>',
    '  <k>"nested"</k><m>: { </m><k>"ok"</k><m>: </m><b>true</b><m> }</m>',
    '<m>}</m>'
  ];
  var JSON_PRE = jsonLines.join('\n');

  var PROSE1 = 'Write a JSON fixture file to <code>/var/folders/…/worker-e2e-test.json</code> with exactly this content (pretty-printed, 2-space indent):';
  var AFTER1 = [
    'Then run <code>cat …/worker-e2e-test.json</code> and confirm the content matches.',
    'Return format (terse):',
    '- Files written: path',
    '- Verified: the cat output line count + that all 5 keys are present (name, purpose, items, nested, ok)',
    '- Blockers: none or the exact error'
  ];

  /* ── builders ────────────────────────────────────────────── */
  function stepRow(num, cls, html){
    return '<div class="step"><div class="row"><span class="gutter' + (cls ? ' ' + cls : '') + '">' + num + '</span><div class="content">' + html + '</div></div></div>';
  }
  function metaRow(text){
    return '<div class="step meta-row"><div class="row"><span class="gutter"></span><div class="content meta">' + text + '</div></div></div>';
  }
  function quoteCard(prose, json, after){
    var h = '<div class="card quote"><span class="qbar"></span><div class="qbody"><div class="qtext">' + prose + '</div>';
    if (json) h += '<pre class="json">' + json + '</pre>';
    (after || []).forEach(function(p){ h += '<div class="qtext">' + p + '</div>'; });
    return h + '</div></div>';
  }
  function thoughtStep(open, interactive, time){
    var label = open ? '− Thought' : '+ Thought';
    var h = '<div class="step"><div class="row' + (interactive ? ' tog' : '') + '"><span class="gutter">2</span><div class="content"><span class="thought">' + label + '</span>' + (time ? ' <span class="t-time">' + time + '</span>' : '') + '</div></div>';
    if (open){
      ['Writing fixture.','Pretty-print 2-space.','Then cat to verify keys.','Confirm content matches.'].forEach(function(t){
        h += '<div class="row"><span class="gutter">│</span><div class="content tbody">' + t + '</div></div>';
      });
    }
    return h + '</div>';
  }
  function codeCard(title, lines){
    var h = '<div class="card code"><div class="ctitle">' + title + '</div>';
    lines.forEach(function(ln, i){
      h += '<div class="cline"><span class="ln">' + (i + 1) + '</span><span class="ctext">' + ln + '</span></div>';
    });
    return h + '</div>';
  }

  /* ── state bodies ────────────────────────────────────────── */
  function doneBody(){
    return stepRow(1, '', quoteCard(PROSE1, JSON_PRE, AFTER1))
      + thoughtStep(state.thought, true, '401ms')
      + stepRow(3, '', codeCard('# Wrote /var/folders/9h/…/worker-e2e-test.json', jsonLines))
      + metaRow('■  Worker  ·  DeepSeek V4 Flash  ·  3t');
  }
  function runningBody(){
    return stepRow(1, '', quoteCard(PROSE1, JSON_PRE, AFTER1))
      + thoughtStep(false, false, '401ms')
      + stepRow(3, 'cur', codeCard('# Wrote /var/folders/9h/…/worker-e2e-test.json',
          [jsonLines[0], jsonLines[1], '<span class="writing">… writing</span>']));
  }
  function failedBody(){
    return stepRow(1, '', quoteCard(PROSE1, JSON_PRE, AFTER1))
      + thoughtStep(false, false)
      + '<div class="step">'
      +   '<div class="row"><span class="gutter err">3</span><div class="content"><span class="errline">exit 1 · worker crashed</span></div></div>'
      +   '<div class="row"><span class="gutter">│</span><div class="content stderr">cat: /var/folders/9h/…/worker-e2e-test.json: No such file or directory</div></div>'
      +   '<div class="row"><span class="gutter">│</span><div class="content stderr">Error: ENOENT: no such file or directory, open \'/var/folders/9h/…/worker-e2e-test.json\'</div></div>'
      + '</div>'
      + metaRow('■  Worker  ·  DeepSeek V4 Flash  ·  3t');
  }
  function multiBody(){
    return stepRow(1, '', quoteCard('Read task-center handleInput…'))
      + thoughtStep(state.thought, true)
      + stepRow(3, '', 'handleInput already routes ←/→ to sibling panes — no change needed.')
      + metaRow('■  explorer  ·  opencode-go/deepseek-v4-flash  ·  2t');
  }
  function emptyBody(){
    return '<div class="empty">'
      + '<div class="e1">No workers yet — spawn a task and this view opens live.</div>'
      + '<div class="e2">↑ / Esc  parent    ← →  siblings    t  thought    y  copy</div>'
      + '</div>';
  }

  /* ── chrome: header / footer / controls ──────────────────── */
  function renderHeader(){
    var head = {
      done:    ['<span class="ok">✓</span> <b>Worker</b><span class="sep"> · </span><span class="model">DeepSeek V4 Flash</span>', '<span class="rt foam">401ms</span>'],
      thought: ['<span class="ok">✓</span> <b>Worker</b><span class="sep"> · </span><span class="model">DeepSeek V4 Flash</span>', '<span class="rt foam">401ms</span>'],
      running: ['<span class="ok gold">◐</span> <b>Worker</b><span class="sep"> · </span><span class="model">DeepSeek V4 Flash</span>', '<span class="rt gold">running  12s</span>'],
      multi:   ['<span class="ok">✓</span> <b>explorer</b><span class="sep"> · </span><span class="model">opencode-go/deepseek-v4-flash</span>', '<span class="rt foam">11s</span>'],
      failed:  ['<span class="ok love">✗</span> <b>Worker</b><span class="sep"> · </span><span class="model">DeepSeek V4 Flash</span>', '<span class="rt love">exit 1  3s</span>'],
      empty:   ['<span class="ok">✓</span> <b>Worker</b><span class="sep"> · </span><span class="model">DeepSeek V4 Flash</span>', '']
    }[state.mode];
    document.getElementById('hLeft').innerHTML = head[0];
    document.getElementById('hRight').innerHTML = head[1];
  }
  function renderFooter(){
    var name = 'Worker', meta, dim = false;
    switch (state.mode){
      case 'running': meta = '(1 of 1)  1.2K (1%)'; break;
      case 'multi':   name = 'explorer'; meta = '(' + state.mi + ' of 3)  22k (99%)'; break;
      case 'failed':  meta = '(1 of 1)  6.1K (4%)'; break;
      case 'empty':   meta = '(1 of 1)  0B (0%)'; dim = true; break;
      default:        meta = '(1 of 1)  5.9K (3%)';
    }
    document.getElementById('fLeft').innerHTML = '<b>' + name + '</b> <span class="f-meta' + (dim ? ' dim' : '') + '">' + meta + '</span>';
    var prev = 'dim', next = 'dim';
    if (state.mode === 'multi'){
      prev = state.mi === 1 ? 'dim' : 'muted';
      next = state.mi === 3 ? 'dim' : 'muted';
    }
    /* keycaps: arrows ONLY — never "up/left/right" */
    document.getElementById('fRight').innerHTML =
      '<span class="key">Parent ↑</span>' +
      '<span class="key ' + prev + '">Prev ←</span>' +
      '<span class="key ' + next + '">Next →</span>';
  }
  var buttons = document.querySelectorAll('.controls button');
  function renderControls(){
    buttons.forEach(function(btn){
      btn.classList.toggle('active', btn.getAttribute('data-state') === state.mode);
    });
  }

  /* ── interactions ────────────────────────────────────────── */
  function toggleThought(){
    if (state.mode === 'multi'){ state.thought = !state.thought; }
    else if (state.mode === 'done' || state.mode === 'thought'){
      state.thought = !state.thought;
      state.mode = state.thought ? 'thought' : 'done';
    } else { return; }
    render();
  }
  function cycle(delta){
    if (state.mode !== 'multi') return;
    state.mi = Math.max(1, Math.min(3, state.mi + delta));
    render();
  }

  buttons.forEach(function(btn){
    btn.addEventListener('click', function(){
      state.mode = btn.getAttribute('data-state');
      state.thought = (state.mode === 'thought');
      render();
    });
  });

  document.getElementById('body').addEventListener('click', function(e){
    if (e.target.closest('.tog')) toggleThought();
  });

  document.getElementById('fRight').addEventListener('click', function(e){
    var k = e.target.closest('.key');
    if (!k || state.mode !== 'multi') return;
    if (k.textContent.indexOf('Prev') === 0 && state.mi > 1) cycle(-1);
    if (k.textContent.indexOf('Next') === 0 && state.mi < 3) cycle(1);
  });

  document.addEventListener('keydown', function(e){
    if (e.key === 't' || e.key === 'T'){ toggleThought(); return; }
    if (e.key === 'ArrowLeft'){ cycle(-1); e.preventDefault(); return; }
    if (e.key === 'ArrowRight'){ cycle(1); e.preventDefault(); return; }
    if (e.key === 'Escape'){ /* intentionally nothing visible */ }
  });

  /* ── render ──────────────────────────────────────────────── */
  function render(){
    var html = {
      done: doneBody, thought: doneBody,
      running: runningBody, multi: multiBody,
      empty: emptyBody, failed: failedBody
    }[state.mode]();
    document.getElementById('body').innerHTML = html;
    renderHeader();
    renderFooter();
    renderControls();
  }
  render();
})();
</script>
</body>
</html>
